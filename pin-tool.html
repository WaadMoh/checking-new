<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Kiosk PIN Tool</title>
    <style>
        :root { --blue: #0034A8; }
        body { margin: 0; padding: 24px 16px; background: #F5F7FA; color: #1F2937; font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
        main { max-width: 640px; margin: 0 auto; padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 6px 22px rgba(0,52,168,.08); }
        h1 { margin-top: 0; color: var(--blue); }
        label { display: block; margin-top: 16px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px; border: 2px solid #C9D7F2; border-radius: 10px; font-size: 20px; letter-spacing: 4px; }
        button { margin-top: 18px; padding: 12px 20px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
        pre { overflow-x: auto; padding: 14px; border-radius: 10px; background: #0F172A; color: #E2E8F0; font-size: 14px; }
        .err { color: #B42318; font-weight: 700; }
        .note { color: #4B5563; line-height: 1.6; }
    </style>
</head>
<body>
<main>
    <h1>Kiosk PIN tool</h1>
    <p class="note">Use this page on an IT PC, not on the kiosk. It turns a new staff PIN into a salted hash. Paste the result into <code>kiosk/config.js</code> in place of the existing <code>pin</code> block, then redeploy. The PIN itself is never stored.</p>
    <label for="pin1">New PIN (6 to 10 digits)</label>
    <input id="pin1" type="password" inputmode="numeric" autocomplete="off">
    <label for="pin2">Repeat PIN</label>
    <input id="pin2" type="password" inputmode="numeric" autocomplete="off">
    <button type="button" id="make">Generate config block</button>
    <p id="msg" class="err" role="alert"></p>
    <pre id="out" hidden></pre>
</main>
<script src="../kiosk/pin.js"></script>
<script>
    document.getElementById('make').addEventListener('click', function () {
        var a = document.getElementById('pin1').value.trim();
        var b = document.getElementById('pin2').value.trim();
        var msg = document.getElementById('msg');
        var out = document.getElementById('out');
        out.hidden = true;
        if (!/^\d{6,10}$/.test(a)) { msg.textContent = 'Use 6 to 10 digits.'; return; }
        if (a !== b) { msg.textContent = 'The two PINs do not match.'; return; }
        if (/^(\d)\1+$/.test(a) || '01234567890'.indexOf(a) !== -1 || '09876543210'.indexOf(a) !== -1) { msg.textContent = 'Avoid repeated or sequential digits.'; return; }
        msg.textContent = '';
        var bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        var salt = Array.prototype.map.call(bytes, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
        var iterations = 20000;
        var hash = KioskPin.pinHash(a, salt, iterations);
        out.textContent = "  pin: {\n    length: " + a.length + ",\n    salt: '" + salt + "',\n    iterations: " + iterations + ",\n    hash: '" + hash + "'\n  }";
        out.hidden = false;
        document.getElementById('pin1').value = '';
        document.getElementById('pin2').value = '';
    });
</script>
</body>
</html>
